[package]
name = "token-duel"
version = "0.2.0"
description = "Token Duel — Anchor program for the Cocos Solana MWA demo"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "token_duel"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# `init-if-needed` is required by `settle_match_skr.rs` so the per-mint
# treasury_token ATA self-creates on first SKR settle. Re-init protection
# comes from the `associated_token::mint = ... authority = treasury`
# constraints which pin the ATA to a single canonical derivation.
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
# betting-duel: SPL token + ATA support for $SKR wagers (join_match_skr,
# settle_match_skr, cancel_match_skr).
anchor-spl = { version = "0.31.1", features = ["token", "associated_token"] }
